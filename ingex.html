<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171a18">
<title>Morning Timer</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #171a18;
    --panel: #202420;
    --line: #373e35;
    --ink: #f4f5e9;
    --muted: #b4bdaf;
    --accent: #dcfa85;
    --cue: var(--accent);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100svh;
    background: radial-gradient(ellipse at 50% 0%, #2b3528, var(--bg) 58%);
    color: var(--ink);
    font: 1rem system-ui, sans-serif;
  }

  main {
    width: min(100% - 2rem, 29rem);
    margin: auto;
    padding: clamp(1.5rem, 5vh, 3rem) 0;
    text-align: center;
  }

  h1 {
    margin: 0 0 1.25rem;
    font-size: clamp(1.9rem, 7vw, 2.7rem);
    font-weight: 680;
    letter-spacing: -.06em;
  }

  .timer {
    padding: 1.35rem clamp(1rem, 5vw, 1.75rem) 1.5rem;
    border: 1px solid var(--line);
    border-radius: 1.75rem;
    background: var(--panel);
    box-shadow: 0 1rem 3rem #0004;
  }

  .dial {
    position: relative;
    width: min(100%, 16rem);
    aspect-ratio: 1;
    margin: auto;
    border-radius: 50%;
    isolation: isolate;
    background: conic-gradient(var(--cue) var(--sweep, 360deg), #465043 0);
  }

  .dial::before {
    content: '';
    position: absolute;
    inset: 5px;
    border-radius: 50%;
    background: radial-gradient(circle, #292f26, #191e19);
  }

  .tick {
    position: absolute;
    inset: 8%;
    transform: rotate(var(--angle));
  }

  .tick::before {
    content: '';
    display: block;
    width: 1px;
    height: 5px;
    margin: auto;
    background: #899482;
  }

  .tick.major::before {
    width: 2px;
    height: 11px;
    background: #e3e8db;
  }

  .hand {
    position: absolute;
    inset: 0;
    transform: rotate(var(--sweep, 360deg));
  }

  .hand::before {
    content: '';
    position: absolute;
    bottom: 50%;
    left: calc(50% - 2px);
    width: 4px;
    height: 34%;
    border-radius: 4px;
    background: var(--cue);
  }

  .hub {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 14px;
    aspect-ratio: 1;
    border: 3px solid var(--cue);
    border-radius: 50%;
    background: var(--panel);
    transform: translate(-50%, -50%);
  }

  .warning { --cue: #ffcb7a; }

  .status {
    min-height: 1.5em;
    margin: 1rem 0 .2rem;
    color: var(--cue);
    font-weight: 650;
  }

  .digital {
    display: block;
    padding-right: .08em;
    font: 600 clamp(3.2rem, 13vw, 4.9rem)/1.05 ui-monospace, 'Courier New', monospace;
    letter-spacing: -.08em;
  }

  .detail {
    min-height: 1.5em;
    margin: .55rem 0 1.2rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .controls { display: flex; flex-wrap: wrap; gap: .55rem; }

  button {
    flex: 1;
    min-height: 3rem;
    border: 1px solid #495445;
    border-radius: .8rem;
    background: #292f27;
    color: var(--ink);
    font: inherit;
    font-weight: 680;
    cursor: pointer;
  }

  button:hover { background: #394335; }
  .primary { background: var(--accent); border-color: var(--accent); color: #202817; }
  .primary:hover { background: #ecffb0; }
  [hidden] { display: none !important; }

  form {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: .75rem;
    margin-top: .85rem;
    text-align: left;
  }

  label { display: block; color: var(--muted); font-size: .875rem; }

  input {
    display: block;
    width: 100%;
    min-height: 2.8rem;
    margin-top: .35rem;
    padding: .55rem .7rem;
    border: 1px solid var(--line);
    border-radius: .65rem;
    background: var(--panel);
    color: var(--ink);
    font: inherit;
    font-size: 1rem;
  }

  input:disabled { opacity: .65; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Morning Timer</h1>

  <section class="timer" aria-label="Workout timer">
    <div class="dial" aria-hidden="true">
      <div class="hand"></div>
      <div class="hub"></div>
    </div>

    <p class="status" role="status">Ready</p>
    <time class="digital" role="timer" aria-label="Workout time remaining">05:00</time>
    <p class="detail">10 intervals · 5-second setup</p>

    <div class="controls">
      <button class="primary" id="start" type="submit" form="settings">Start</button>
      <button class="primary" id="pause" type="button" hidden>Pause</button>
      <button id="end" type="button" hidden>End</button>
      <button id="reset" type="button" hidden>Reset</button>
    </div>
  </section>

  <form id="settings" aria-label="Timer settings">
    <label>
      Duration (min)
      <input id="duration" type="number" min="0.05" max="999" step="any" value="5" required>
    </label>
    <label>
      Interval (sec)
      <input id="interval" type="number" min="1" max="59940" step="1" value="30" required>
    </label>
  </form>
</main>

<script>
  const element = (selector) => document.querySelector(selector);
  const panel = element('.timer');
  const dial = element('.dial');
  const status = element('.status');
  const digital = element('.digital');
  const detail = element('.detail');
  const settings = element('#settings');
  const duration = element('#duration');
  const interval = element('#interval');
  const start = element('#start');
  const pause = element('#pause');
  const end = element('#end');
  const reset = element('#reset');

  for (let index = 0; index < 60; index++) {
    const tick = document.createElement('span');
    tick.className = index % 5 === 0 ? 'tick major' : 'tick';
    tick.style.setProperty('--angle', index * 6 + 'deg');
    dial.prepend(tick);
  }

  const setupTime = 5000;
  let total = 300000;
  let intervalTime = 30000;
  let state = 'ready';
  let elapsed = 0;
  let startedAt = 0;
  let frame;
  let lastCue = '';
  let audio;
  let cueTrack;

  function sound(cue) {
    if (cue === lastCue) return;
    lastCue = cue;
    if (!audio || audio.state !== 'running') return;

    const notes = {
      warning: [500],
      next: [740, 990],
      finish: [660, 880, 1100]
    }[cue.split(':')[0]];

    if (!notes) return;

    notes.forEach((frequency, index) => {
      const at = audio.currentTime + index * .13;
      const oscillator = audio.createOscillator();
      const volume = audio.createGain();

      oscillator.frequency.value = frequency;
      volume.gain.setValueAtTime(.001, at);
      volume.gain.exponentialRampToValueAtTime(.18, at + .015);
      volume.gain.exponentialRampToValueAtTime(.001, at + .12);
      oscillator.connect(volume).connect(cueTrack);
      oscillator.start(at);
      oscillator.stop(at + .13);
    });
  }

  function silence() {
    if (cueTrack) {
      cueTrack.disconnect();
      cueTrack = undefined;
    }
  }

  function format(milliseconds) {
    const seconds = Math.ceil(milliseconds / 1000);
    const minutes = Math.floor(seconds / 60);
    return [minutes, seconds % 60]
      .map((value) => String(value).padStart(2, '0'))
      .join(':');
  }

  function render() {
    const count = Math.ceil(total / intervalTime);
    const isActive = state === 'running' || state === 'paused';
    const isSetup = isActive && elapsed < setupTime;
    const workoutElapsed = Math.max(0, elapsed - setupTime);
    const remaining = Math.max(0, total - workoutElapsed);
    const intervalIndex = Math.min(count - 1, Math.floor(workoutElapsed / intervalTime));
    const intervalEnd = Math.min(total, (intervalIndex + 1) * intervalTime);
    const intervalSeconds = Math.ceil((intervalEnd - workoutElapsed) / 1000);
    const warning = state === 'running' && !isSetup && intervalSeconds <= 3;

    const label = {
      ready: 'Ready',
      running: isSetup ? 'Get ready' : 'Interval ' + (intervalIndex + 1) + ' of ' + count,
      paused: 'Paused',
      ended: 'Workout ended',
      complete: 'Workout complete'
    }[state];

    if (status.textContent !== label) status.textContent = label;

    const timeLeft = isSetup ? setupTime - elapsed : remaining;
    const timeLimit = isSetup ? setupTime : total;
    digital.setAttribute('aria-label', isSetup ? 'Setup time remaining' : 'Workout time remaining');
    const display = format(timeLeft);
    if (digital.textContent !== display) digital.textContent = display;
    dial.style.setProperty('--sweep', (timeLeft / timeLimit) * 360 + 'deg');
    panel.classList.toggle('warning', warning);

    const summary = count + (count === 1 ? ' interval' : ' intervals');
    const message = {
      ready: summary + ' · 5-second setup',
      running: isSetup
        ? 'Workout begins in ' + Math.ceil(timeLeft / 1000) + 's'
        : 'Interval ends in ' + intervalSeconds + 's',
      paused: isSetup
        ? 'Setup paused'
        : 'Interval ' + (intervalIndex + 1) + ' · ' + intervalSeconds + 's left',
      ended: 'Time remaining',
      complete: summary + ' finished'
    }[state];

    if (detail.textContent !== message) detail.textContent = message;

    duration.disabled = interval.disabled = isActive;
    start.hidden = isActive;
    start.textContent = state === 'ready' ? 'Start' : 'Start again';
    pause.hidden = !isActive;
    pause.textContent = state === 'paused' ? 'Resume' : 'Pause';
    end.hidden = !isActive;
    reset.hidden = state === 'ready';

    if (state === 'running' && !isSetup) {
      // Give the starting chime space before the warning on short intervals.
      if (workoutElapsed - intervalIndex * intervalTime < 280) {
        sound('next:' + intervalIndex);
      } else if (warning) {
        sound('warning:' + intervalIndex + ':' + intervalSeconds);
      } else {
        sound('steady:' + intervalIndex);
      }
    }
  }

  function update(now) {
    elapsed = Math.min(setupTime + total, Math.max(0, now - startedAt));

    if (elapsed === setupTime + total) {
      state = 'complete';
      sound('finish');
      render();
      if (document.activeElement === document.body) start.focus();
      return;
    }

    render();
    frame = requestAnimationFrame(update);
  }

  function readSettings() {
    if (!settings.checkValidity()) return false;
    total = Math.round(duration.valueAsNumber * 60) * 1000;
    intervalTime = interval.valueAsNumber * 1000;
    return true;
  }

  function begin() {
    if (audio) {
      silence();
      cueTrack = audio.createGain();
      cueTrack.connect(audio.destination);
      audio.resume().catch(() => {});
    }

    startedAt = performance.now() - elapsed;
    state = 'running';
    update(performance.now());
  }

  settings.addEventListener('submit', (event) => {
    event.preventDefault();
    if (state === 'running' || state === 'paused' || !readSettings()) return;

    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!audio && Audio) audio = new Audio();

    elapsed = 0;
    lastCue = '';
    begin();
    pause.focus();
  });

  settings.addEventListener('input', () => {
    if (state === 'ready' && readSettings()) render();
  });

  pause.addEventListener('click', () => {
    if (state === 'paused') {
      begin();
      return;
    }

    cancelAnimationFrame(frame);
    elapsed = Math.min(total + setupTime, performance.now() - startedAt);
    silence();
    state = 'paused';
    render();
  });

  end.addEventListener('click', () => {
    cancelAnimationFrame(frame);
    if (state === 'running') {
      elapsed = Math.min(total + setupTime, performance.now() - startedAt);
    }
    silence();
    state = 'ended';
    render();
    start.focus();
  });

  reset.addEventListener('click', () => {
    cancelAnimationFrame(frame);
    silence();
    elapsed = 0;
    lastCue = '';
    state = 'ready';
    readSettings();
    render();
    start.focus();
  });

  render();
</script>
</body>
</html>
